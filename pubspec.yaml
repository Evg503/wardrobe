name: wardrobe
description: Wardrobe app - floor plan scanner and object recognition
publish_to: 'none'

version: 1.2.0+2

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  camera: ^0.11.0
  google_mlkit_object_detection: ^0.14.0
  shared_preferences: ^2.3.0
  arkit_plugin: ^1.5.0
  vector_math: ^2.1.4
  package_info_plus: ^8.0.0
  pdf: ^3.11.0
  path_provider: ^2.1.0
  path: ^1.9.0
  share_plus: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/ml/furniture_detector.tflite
    - assets/ml/furniture_labels.txt
